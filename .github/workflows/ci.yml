name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publish a release without pushing a tag from a terminal:
  # Actions ▸ CI ▸ Run workflow ▸ tag = v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.1.0); leave empty for a plain CI run"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test-linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install AT-SPI / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config tesseract-ocr
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p computer-use-mcp --all-targets --features http
      - run: cargo test --workspace
      # Examples' own tests don't run with the workspace's (an example is
      # built, not tested, by default): the bench's scenario checks.
      - run: cargo test -p computer-use --example agent_bench

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Install AT-SPI / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p computer-use-mcp --features http --locked

  cross-check:
    name: Type-check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  live-linux:
    name: Live GTK test (Xvfb + AT-SPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config tesseract-ocr \
            xvfb dbus-x11 at-spi2-core libatk-bridge2.0-0 xclip \
            gtk-3-examples libgtk-3-bin python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: Run live backend test
        run: bash crates/computer-use/tests/run_live_linux.sh

  live-wayland:
    name: Live Wayland test (headless sway + AT-SPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config sway xwayland grim dbus-x11 at-spi2-core \
            libatk-bridge2.0-0 gtk-3-examples libgtk-3-bin python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 gir1.2-atspi-2.0 foot
      - name: Build the tests
        run: cargo test -p computer-use --test live_wayland_engine --test live_wayland --no-run
      - name: Engine over Wayland (native GTK app, scale 1 and 1.5)
        run: |
          fixture="$PWD/crates/computer-use/tests/fixtures/gtk_app.py"
          for scale in 1 1.5; do
            CU_SCALE=$scale APPS="python3 $fixture" scripts/wayland-session.sh \
              env COMPUTER_USE_LIVE_WAYLAND=1 \
              cargo test -p computer-use --test live_wayland_engine -- --nocapture
          done
      - name: Wayland protocols (screencopy, virtual pointer and keyboard)
        run: |
          APPS=gtk3-widget-factory scripts/wayland-session.sh \
            cargo test -p computer-use --test live_wayland -- --ignored --nocapture --test-threads=1

  live-windows:
    name: Live Windows overlay test (hub, Notepad)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p computer-use-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Calls 4 s apart, as a model's: the server keeps its hub and the
      # overlay shows after every call (v3.9.0-v3.9.4 lost both on Windows).
      - run: python crates/computer-use/tests/live_windows_overlay.py target\debug\computer-use-mcp.exe

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Nothing is packaged (or released) unless every test job passed.
    needs: [lint-test-linux, msrv, cross-check, live-linux, live-wayland, live-windows]
    # softprops/action-gh-release creates the release and uploads assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            exe: computer-use-mcp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            exe: computer-use-mcp
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            exe: computer-use-mcp
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: computer-use-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libxcb1-dev pkg-config
      - name: Build
        run: cargo build --release -p computer-use-mcp --features http --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp mcp.example.json README.md CHANGELOG.md LICENSE NOTICE dist/
          # The layered skills (skills/computer-use, skills/computer-use-security).
          mkdir -p dist/skills && cp -R skills/. dist/skills/
          # Claude Code installers, client examples and the connection guide.
          cp scripts/claude-code/install.sh scripts/claude-code/install.ps1 scripts/claude-code/install.cmd dist/
          cp scripts/claude-code/README.txt dist/README-claude-code.txt
          cp -r examples dist/examples
          mkdir -p dist/docs && cp docs/CONNECT.md dist/docs/
          # Also a valid Claude plugin (.claude-plugin/plugin.json + .mcp.json + skills/),
          # so the same zip works with "Upload local plugin".
          bash scripts/claude-code/plugin-files.sh dist "${{ matrix.exe }}"
          # The same plugin without the program (hosts that refuse executables
          # in uploaded plugins): it runs the copy install.cmd / install.sh put
          # in ~/.computer-use/bin.
          mkdir -p plugin-only
          bash scripts/claude-code/plugin-files.sh plugin-only "${{ matrix.exe }}" "" installed
          cp scripts/claude-code/PLUGIN-README.txt plugin-only/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-mcp-${{ matrix.name }}
          # .claude-plugin/plugin.json and .mcp.json are hidden files.
          include-hidden-files: true
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-plugin-${{ matrix.name }}
          include-hidden-files: true
          path: plugin-only/
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../computer-use-mcp-${{ matrix.name }}.zip .; else zip -r ../computer-use-mcp-${{ matrix.name }}.zip .; fi
          cd ../plugin-only
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../computer-use-plugin-${{ matrix.name }}.zip .; else zip -r ../computer-use-plugin-${{ matrix.name }}.zip .; fi
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # This tag's section of CHANGELOG.md (if it has one), then how to install.
          new=$(awk -v h="## $TAG" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md)
          {
            echo "MCP server for Claude Code (and any MCP client): control desktop apps"
            echo "through their accessibility tree plus screenshots."
            echo
            if [ -n "$new" ]; then
              echo "## What's new in $TAG"
              printf '%s\n\n' "$new"
            fi
            cat <<'EOF'
          ## Install

          **Windows:** download `computer-use-mcp-windows-x64.zip`, extract it to a
          permanent folder (for example `C:\Tools\computer-use-mcp`), then double-click
          `install.cmd` (or run `claude mcp add --scope user computer-use -- C:\Tools\computer-use-mcp\computer-use-mcp.exe serve`).
          Check with `claude mcp list`.

          **As a plugin** (*Customize ▸ Plugins ▸ Upload local plugin*): upload the full
          `computer-use-mcp-<os>.zip`. If "Upload failed" appears and a `computer-use` plugin is
          already installed, remove the old one first, then upload again.
          Only if the full zip is refused for containing a program, use the small
          `computer-use-plugin-<os>.zip` (about 50 KB, no program inside on purpose): first run
          `install.cmd -NoRegister` (Windows) / `./install.sh --no-register` from the full zip,
          which copies the program to `~/.computer-use/bin`; then upload the plugin zip.

          **macOS / Linux:** download your platform's zip, extract it, run `./install.sh`.
          macOS needs Accessibility and Screen Recording permission for the app that runs Claude Code.

          Every zip contains the binary, the installers, `docs/CONNECT.md` (Claude Code, Claude Desktop,
          Codex, Cursor, VS Code, HTTP) and ready-to-copy configs in `examples/`.
          The binaries are not code-signed, so Windows SmartScreen may ask you to confirm.
          EOF
          } > release-notes.md
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: computer-use-mcp ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            computer-use-mcp-${{ matrix.name }}.zip
            computer-use-plugin-${{ matrix.name }}.zip
