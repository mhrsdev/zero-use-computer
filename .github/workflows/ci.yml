name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publish a release without pushing a tag from a terminal:
  # Actions ▸ CI ▸ Run workflow ▸ tag = v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example v0.1.0); leave empty for a plain CI run"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test-linux:
    name: Lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install AT-SPI / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config tesseract-ocr
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p computer-use-mcp --all-targets --features http
      - run: cargo test --workspace

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Install AT-SPI / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p computer-use-mcp --features http --locked

  cross-check:
    name: Type-check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  live-linux:
    name: Live GTK test (Xvfb + AT-SPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libxcb1-dev pkg-config tesseract-ocr \
            xvfb dbus-x11 at-spi2-core libatk-bridge2.0-0 xclip \
            gtk-3-examples libgtk-3-bin python3-gi python3-gi-cairo gir1.2-gtk-3.0
      - name: Run live backend test
        run: bash crates/computer-use/tests/run_live_linux.sh

  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # softprops/action-gh-release creates the release and uploads assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            exe: computer-use-mcp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            exe: computer-use-mcp
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
            exe: computer-use-mcp
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            exe: computer-use-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libxcb1-dev pkg-config
      - name: Build
        run: cargo build --release -p computer-use-mcp --features http --target ${{ matrix.target }}
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp mcp.example.json README.md README.fa.md dist/
          cp skill/SKILL.md dist/SKILL.md
          # Claude Code installers, client examples and the connection guide.
          cp scripts/claude-code/install.sh scripts/claude-code/install.ps1 scripts/claude-code/install.cmd dist/
          cp scripts/claude-code/README.txt dist/README-claude-code.txt
          cp -r examples dist/examples
          mkdir -p dist/docs && cp docs/CONNECT.md dist/docs/
          # Also a valid Claude plugin (.claude-plugin/plugin.json + .mcp.json + skills/),
          # so the same zip works with "Upload local plugin".
          bash scripts/claude-code/plugin-files.sh dist "${{ matrix.exe }}"
      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-mcp-${{ matrix.name }}
          path: dist/
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../computer-use-mcp-${{ matrix.name }}.zip .; else zip -r ../computer-use-mcp-${{ matrix.name }}.zip .; fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: computer-use-mcp ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            MCP server for Claude Code (and any MCP client): control desktop apps
            through their accessibility tree plus screenshots.

            **Windows:** download `computer-use-mcp-windows-x64.zip`, extract it to a
            permanent folder (for example `C:\Tools\computer-use-mcp`), then double-click
            `install.cmd` (or run `claude mcp add --scope user computer-use -- C:\Tools\computer-use-mcp\computer-use-mcp.exe serve`).
            Check with `claude mcp list`.

            **As a plugin:** the same zip is a valid Claude plugin (`.claude-plugin/plugin.json`,
            `.mcp.json`, `skills/`), so it also works with *Customize ▸ Plugins ▸ Upload local plugin*
            in apps that support local plugins, or `claude --plugin-dir <extracted folder>` in Claude Code.

            **macOS / Linux:** download your platform's zip, extract it, run `./install.sh`.
            macOS needs Accessibility and Screen Recording permission for the app that runs Claude Code.

            Every zip contains the binary, the installers, `docs/CONNECT.md` (Claude Code, Claude Desktop,
            Codex, Cursor, VS Code, HTTP) and ready-to-copy configs in `examples/`.
            The binaries are not code-signed, so Windows SmartScreen may ask you to confirm.
          files: computer-use-mcp-${{ matrix.name }}.zip
