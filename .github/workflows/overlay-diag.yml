name: Overlay diagnosis (Windows)

# Temporary: the released v3.9.4 against this branch's build.
on:
  push:
    branches: ["ccr-4dbc414e-c3y6g5"]
    paths: [".github/workflows/overlay-diag.yml", "scripts/overlay_diag.py", "crates/computer-use/src/overlay/**", "crates/computer-use/src/engine/overlay.rs"]
  workflow_dispatch:

jobs:
  released:
    name: v3.9.4 (released) on windows-2025
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/mhrsdev/zero-use-computer/releases/download/v3.9.4/computer-use-mcp-windows-x64.zip" -OutFile m.zip
          Expand-Archive m.zip -DestinationPath rel
      - run: python scripts/overlay_diag.py rel
  built:
    name: this branch on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p computer-use-mcp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/overlay_diag.py target\debug\computer-use-mcp.exe
