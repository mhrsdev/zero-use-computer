[package]
name = "computer-use"
description = "Codex-style computer use for any agent: accessibility-tree + screenshot desktop control"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
dirs.workspace = true
image.workspace = true
log.workspace = true
memmap2 = "0.9"
regex = "1"
rhai = { version = "1.26", features = ["serde", "only_i64", "no_custom_syntax"] }
rustybuzz = "0.20"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
toml.workspace = true
toml_edit.workspace = true
unicode-bidi = "0.3"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
x11rb = { version = "0.14", features = ["xtest", "shape", "screensaver", "randr"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSData", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "NSApplication", "NSPasteboard", "libc", "NSCell", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
