<!doctype html>
<html lang="en" data-theme="__THEME__" data-accent="__ACCENT__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zero panel [private]</title>
<link rel="icon" type="image/png" href="cursor/orbit.png">
<style>
  :root {
    --primary: #1a73e8; --on-primary: #ffffff;
    --primary-container: #d3e3fd; --on-primary-container: #041e49;
    --surface: #f8f9fc; --surface-1: #f0f3f9; --surface-2: #e9eef6; --surface-3: #e1e8f2;
    --on-surface: #1a1c1e; --on-surface-variant: #43474e;
    --outline: #74777f; --outline-variant: #c4c7cf;
    --error: #b3261e; --on-error: #ffffff; --ok: #146c2e;
    --radius: 16px; --focus: 2px solid var(--primary);
    --font: "Google Sans", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  html[data-theme=light] { color-scheme: light; }
  html[data-theme=dark] { color-scheme: dark; }
  body {
    margin: 0; background: var(--surface); color: var(--on-surface);
    font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* top app bar */
  header.bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 16px 0 24px; background: var(--surface);
  }
  header.bar h1 { font: 400 22px/28px var(--font); margin: 0; white-space: nowrap; }
  header.bar .ver { color: var(--on-surface-variant); font-size: 12px; margin-left: 8px; }
  .search {
    flex: 1; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    height: 48px; border-radius: 28px; padding: 0 16px; background: var(--surface-2);
  }
  .search input[type=text] { flex: 1; width: auto; min-width: 0; height: 40px; padding: 0; border: 0; border-radius: 0; background: transparent; outline: none; }
  .search:focus-within { outline: var(--focus); }
  .search input:focus { outline: none; }
  .spacer { flex: 1; }

  /* segmented button */
  .seg { display: inline-flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; height: 32px; padding: 0 14px; cursor: pointer;
    border-left: 1px solid var(--outline); color: var(--on-surface);
  }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed=true] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 500; }
  .seg button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .seg button[aria-pressed=true]:hover { background: var(--primary-container); }

  /* layout */
  .layout { display: flex; gap: 8px; padding: 0 16px 48px; max-width: 1180px; margin: 0 auto; }
  nav.rail { position: sticky; top: 64px; align-self: flex-start; width: 236px; flex: none; padding: 8px 0; max-height: calc(100vh - 72px); overflow: auto; }
  nav.rail button {
    display: flex; align-items: center; justify-content: space-between; width: 100%; height: 48px;
    padding: 0 16px; border: 0; border-radius: 28px; background: transparent; cursor: pointer; text-align: left;
    color: var(--on-surface-variant);
  }
  nav.rail button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  nav.rail button[aria-current=true] { background: var(--primary-container); color: var(--on-primary-container); font-weight: 500; }
  nav.rail .count { font-size: 12px; opacity: .8; }
  main { flex: 1; min-width: 0; padding: 8px 8px 0; }
  main h2 { font: 400 28px/36px var(--font); margin: 8px 0 4px; }
  main p.lead { margin: 0 0 16px; color: var(--on-surface-variant); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .chip {
    height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed=true] { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }

  /* cards and rows */
  .card { background: var(--surface-1); border-radius: var(--radius); padding: 8px 0; margin: 0 0 16px; }
  .card.pad { padding: 20px 24px; }
  .card h3 { font: 500 16px/24px var(--font); margin: 0 0 4px; padding: 12px 24px 0; }
  .card.pad h3 { padding: 0; }
  .row { display: flex; align-items: center; gap: 16px; padding: 12px 24px; }
  .row + .row { border-top: 1px solid var(--outline-variant); }
  .row .text { flex: 1; min-width: 0; }
  .row .label { font-weight: 500; }
  .row .help { color: var(--on-surface-variant); }
  .row .meta { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--on-surface-variant); }
  .row .meta code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .badge { padding: 0 8px; border-radius: 8px; background: var(--surface-3); line-height: 18px; }
  .badge.changed { background: var(--primary-container); color: var(--on-primary-container); }
  .badge.warn { background: color-mix(in srgb, var(--error) 14%, transparent); color: var(--error); }
  .ctl { display: flex; align-items: center; gap: 8px; flex: none; max-width: 52%; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; padding: 0 8px 32px; }
    nav.rail { position: static; width: auto; display: flex; gap: 4px; overflow-x: auto; max-height: none; padding: 0 0 8px; }
    nav.rail button { width: auto; flex: none; height: 40px; }
    .row { flex-direction: column; align-items: stretch; gap: 8px; }
    .ctl { max-width: none; justify-content: flex-start; }
    header.bar { padding: 8px 8px 4px 12px; gap: 8px; height: auto; flex-wrap: wrap; }
    header.bar .ver, header.bar h1 span.long { display: none; }
    .search { order: 3; flex: 1 1 100%; max-width: none; height: 44px; }
    .spacer { display: none; }
    nav.rail button { gap: 8px; }
    header.bar h1 { flex: 1; }
  }

  /* controls */
  input[type=text], input[type=number], input[type=password], input[type=url], select {
    height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline);
    background: transparent; min-width: 0;
  }
  input[type=number] { width: 120px; }
  input[type=text], input[type=password], input[type=url] { width: 260px; max-width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
  select { padding-right: 28px; background: var(--surface-1); }
  input[type=range] { width: 200px; accent-color: var(--primary); }
  input[type=color] { width: 40px; height: 40px; padding: 2px; border-radius: 8px; border: 1px solid var(--outline); background: transparent; }
  .unit { color: var(--on-surface-variant); }
  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; }
  .switch span { position: absolute; inset: 0; border-radius: 16px; border: 2px solid var(--outline); background: var(--surface-3); transition: background .15s; }
  .switch span::after {
    content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--outline); transition: transform .15s, width .15s, height .15s, background .15s;
  }
  .switch input:checked + span { background: var(--primary); border-color: var(--primary); }
  .switch input:checked + span::after { transform: translate(20px, -2px); width: 24px; height: 24px; background: var(--on-primary); top: 6px; left: 2px; }
  .switch input:focus-visible + span { outline: var(--focus); outline-offset: 2px; }
  .btn {
    height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; font-weight: 500; color: var(--primary);
  }
  .btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .btn.filled { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.filled:hover { background: color-mix(in srgb, var(--primary) 88%, black); }
  .btn.danger { color: var(--error); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { height: 28px; padding: 0 12px; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .chips .tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px 0 12px; border-radius: 8px; border: 1px solid var(--outline); }
  .chips .tag button { border: 0; background: transparent; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; line-height: 1; }
  .chips .tag button:hover { background: color-mix(in srgb, var(--on-surface) 12%, transparent); }
  .chips input { width: 160px; height: 32px; }

  /* pointer picker */
  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; padding: 12px 24px 16px; }
  .pick {
    border: 2px solid var(--outline-variant); border-radius: 12px; background: var(--surface); cursor: pointer;
    padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 96px; justify-content: center;
  }
  .pick img { width: 56px; height: 56px; object-fit: contain; }
  .pick[aria-pressed=true] { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
  .pick:hover { border-color: var(--primary); }
  .pick .glyph { font-size: 28px; line-height: 56px; height: 56px; }

  /* decision form */
  .kinds { display: grid; gap: 8px; margin: 8px 0 16px; }
  .kind { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--outline-variant); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
  .kind:has(input:checked) { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
  .kind b { display: block; }
  .kind span { color: inherit; opacity: .8; font-size: 13px; }
  .field { margin: 0 0 16px; }
  .field label { display: block; font-weight: 500; margin-bottom: 6px; }
  .field input { width: 100%; max-width: 520px; }
  .hint { color: var(--on-surface-variant); font-size: 12px; margin-top: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .msg { min-height: 20px; margin-top: 12px; overflow-wrap: anywhere; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--error); }
  .empty { padding: 32px 24px; color: var(--on-surface-variant); text-align: center; }

  /* snackbar and dialog */
  #snack {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 80px); opacity: 0; pointer-events: none;
    background: var(--on-surface); color: var(--surface); padding: 12px 20px; border-radius: 8px; max-width: min(560px, 92vw);
    transition: transform .2s, opacity .2s; z-index: 20; overflow-wrap: anywhere;
  }
  #snack.show { transform: translate(-50%, 0); opacity: 1; }
  #snack.bad { background: var(--error); color: var(--on-error); }
  dialog { border: 0; border-radius: 28px; padding: 24px; max-width: min(480px, 92vw); background: var(--surface-2); color: var(--on-surface); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  dialog h3 { font: 400 24px/32px var(--font); margin: 0 0 12px; }
  dialog ul { margin: 8px 0 0; padding-left: 20px; }
  dialog .actions { justify-content: flex-end; margin-top: 24px; }
  footer.where { color: var(--on-surface-variant); font-size: 12px; padding: 8px 8px 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="bar">
  <h1>Zero<span class="long"> panel</span><span class="ver" id="ver"></span></h1>
  <label class="search" aria-label="Search settings">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
    <input id="q" type="text" placeholder="Search all settings" autocomplete="off" spellcheck="false">
  </label>
  <div class="seg" role="group" aria-label="Theme" id="themes">
    <button data-t="light" aria-pressed="false">Light</button>
    <button data-t="system" aria-pressed="false">Auto</button>
    <button data-t="dark" aria-pressed="false">Dark</button>
  </div>
  <button class="btn" id="done">Done</button>
</header>
<div class="layout">
  <nav class="rail" id="nav" aria-label="Settings groups"></nav>
  <main id="main" aria-live="polite"></main>
</div>
<div id="snack" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg_t">
  <h3 id="dlg_t">Change protected settings?</h3>
  <div id="dlg_b"></div>
  <div class="actions"><button class="btn" id="dlg_no">Cancel</button><button class="btn filled" id="dlg_yes">Change</button></div>
</dialog>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  return el;
}
async function post(route, body) {
  const r = await fetch(route, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}

/* ---------- palette ---------- */
function hexToHsl(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60;
  }
  return [hh, s * 100, l * 100];
}
function applyPalette(accent, dark) {
  const m = /^#[0-9a-f]{6}/i.exec(accent || "") ? accent : "#1A73E8";
  const [hh, s0] = hexToHsl(m); const s = Math.max(35, Math.min(90, s0));
  const c = (sat, l) => `hsl(${hh.toFixed(0)} ${sat.toFixed(0)}% ${l}%)`;
  const t = dark ? {
    "--primary": c(s, 78), "--on-primary": c(s, 14), "--primary-container": c(s * .8, 28), "--on-primary-container": c(s, 90),
    "--surface": c(12, 9), "--surface-1": c(10, 13), "--surface-2": c(9, 17), "--surface-3": c(9, 22),
    "--on-surface": c(8, 90), "--on-surface-variant": c(6, 72), "--outline": c(5, 56), "--outline-variant": c(6, 28),
    "--error": "#f2b8b5", "--on-error": "#601410", "--ok": "#7dd99a",
  } : {
    "--primary": c(s, 40), "--on-primary": "#ffffff", "--primary-container": c(Math.min(s, 85), 90), "--on-primary-container": c(s, 14),
    "--surface": c(25, 98), "--surface-1": c(20, 95), "--surface-2": c(18, 92), "--surface-3": c(16, 88),
    "--on-surface": c(10, 10), "--on-surface-variant": c(8, 32), "--outline": c(8, 48), "--outline-variant": c(10, 80),
    "--error": "#b3261e", "--on-error": "#ffffff", "--ok": "#146c2e",
  };
  for (const [k, v] of Object.entries(t)) document.documentElement.style.setProperty(k, v);
}
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function theme(t) {
  const root = document.documentElement; root.dataset.theme = t;
  const dark = t === "dark" || (t === "system" && mq.matches);
  applyPalette(root.dataset.accent, dark);
  for (const b of document.querySelectorAll("#themes button")) b.setAttribute("aria-pressed", String(b.dataset.t === t));
}
mq.addEventListener("change", () => theme(document.documentElement.dataset.theme));

/* ---------- state ---------- */
let S = null, current = "", snackTimer = 0;
const view = { query: "", changedOnly: false, advanced: false };

function snack(text, bad) {
  const el = $("snack"); el.textContent = text; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(snackTimer); snackTimer = setTimeout(() => { el.className = ""; }, bad ? 6000 : 2200);
}
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function labelOf(e) { const k = e.key.split(".").pop().replace(/_/g, " "); return k.charAt(0).toUpperCase() + k.slice(1); }

function confirmDialog(entries) {
  return new Promise((resolve) => {
    const body = $("dlg_b"); body.textContent = "";
    body.append(h("div", {}, "These settings limit what the agent can do or see, or how the program updates. Check that you meant to change them:"),
      h("ul", {}, entries.map((e) => h("li", {}, labelOf(e) + " (" + e.key + ")"))));
    const dlg = $("dlg"); const done = (v) => { dlg.close(); resolve(v); };
    $("dlg_yes").onclick = () => done(true); $("dlg_no").onclick = () => done(false);
    dlg.oncancel = () => resolve(false);
    dlg.showModal(); $("dlg_no").focus();
  });
}

async function apply(entries, values) {
  // entries: [entry]; values: [json value]. Protected ones are confirmed first.
  const prot = entries.filter((e) => e.confirm);
  let confirmed = false;
  if (prot.length) { if (!(await confirmDialog(prot))) { render(); return false; } confirmed = true; }
  const r = await post("set", { confirmed, changes: entries.map((e, i) => ({ key: e.key, value: values[i] })) });
  if (!r.ok) { snack(r.error || "Not saved.", true); render(); return false; }
  for (const [k, v] of Object.entries(r.values || {})) { const e = S.entries.find((x) => x.key === k); if (e) { e.value = v; e.changed = !same(v, e.default); } }
  if (r.theme) { document.documentElement.dataset.accent = r.accent; theme(r.theme); }
  snack("Saved. Running servers use it now."); render(); return true;
}
async function reset(e) {
  if (e.confirm && !(await confirmDialog([e]))) return;
  const r = await post("reset", { confirmed: !!e.confirm, keys: [e.key] });
  if (!r.ok) return snack(r.error || "Not reset.", true);
  for (const [k, v] of Object.entries(r.values || {})) { const x = S.entries.find((y) => y.key === k); if (x) { x.value = v; x.changed = false; } }
  if (r.theme) { document.documentElement.dataset.accent = r.accent; theme(r.theme); }
  snack("Back to the default."); render();
}

/* ---------- controls ---------- */
function control(e) {
  const id = "c_" + e.key.replace(/\./g, "_");
  const commit = (v) => apply([e], [v]);
  switch (e.type) {
    case "bool": {
      const i = h("input", { type: "checkbox", id, checked: !!e.value, role: "switch", "aria-label": labelOf(e), onchange: () => commit(i.checked) });
      return h("label", { class: "switch" }, i, h("span"));
    }
    case "choice": {
      if (e.choices.length <= 3) return h("div", { class: "seg", role: "group", "aria-label": labelOf(e) },
        e.choices.map((c) => h("button", { "aria-pressed": String(e.value === c), onclick: () => e.value !== c && commit(c) }, c)));
      return h("select", { id, "aria-label": labelOf(e), onchange: (ev) => commit(ev.target.value) },
        e.choices.map((c) => h("option", { value: c, selected: e.value === c }, c)));
    }
    case "range": {
      const num = h("input", { type: "number", id, min: e.min, max: e.max, step: e.step, value: e.value });
      const rng = h("input", { type: "range", min: e.min, max: e.max, step: e.step, value: e.value, "aria-label": labelOf(e) + " slider" });
      rng.oninput = () => { num.value = rng.value; };
      rng.onchange = () => commit(Number(rng.value));
      num.onchange = () => { if (num.value === "" || isNaN(Number(num.value))) return render(); rng.value = num.value; commit(Number(num.value)); };
      return [rng, num, e.unit && h("span", { class: "unit" }, e.unit)];
    }
    case "int": case "float": {
      const num = h("input", { type: "number", id, step: e.type === "float" ? "any" : "1", value: e.value });
      num.onchange = () => { if (num.value === "" || isNaN(Number(num.value))) return render(); commit(Number(num.value)); };
      return [num, e.unit && h("span", { class: "unit" }, e.unit)];
    }
    case "color": {
      const text = h("input", { type: "text", id, value: e.value, spellcheck: false, size: 10, style: "width:120px" });
      const pick = h("input", { type: "color", value: /^#[0-9a-f]{6}/i.test(e.value) ? e.value.slice(0, 7) : "#000000", "aria-label": labelOf(e) + " picker" });
      pick.onchange = () => commit(pick.value.toUpperCase());
      text.onchange = () => commit(text.value.trim());
      return [pick, text];
    }
    case "list": {
      const box = h("div", { class: "chips" });
      const set = (list) => commit(list);
      for (const item of e.value) box.append(h("span", { class: "tag" }, item,
        h("button", { "aria-label": "Remove " + item, title: "Remove", onclick: () => set(e.value.filter((x) => x !== item)) }, "×")));
      const add = h("input", { type: "text", placeholder: "Add and press Enter", "aria-label": "Add to " + labelOf(e), spellcheck: false });
      add.onkeydown = (ev) => { if (ev.key === "Enter" && add.value.trim()) { ev.preventDefault(); set([...e.value.filter((x) => x !== add.value.trim()), add.value.trim()]); } };
      box.append(add); return box;
    }
    case "secret": {
      const i = h("input", { type: "password", id, autocomplete: "off", spellcheck: false, placeholder: e.value ? "Saved " + e.value + ". Type to replace." : "Not set" });
      i.onchange = async () => { if (!i.value) return; const v = i.value; i.value = ""; await commit(v); };
      return i;
    }
    default: {
      const i = h("input", { type: "text", id, value: e.value, spellcheck: false, autocomplete: "off", placeholder: e.type === "hotkey" ? "for example ctrl+alt+escape" : "" });
      i.onchange = () => commit(i.value);
      return i;
    }
  }
}

function row(e) {
  const meta = h("div", { class: "meta" }, h("code", {}, e.key),
    e.changed && h("span", { class: "badge changed" }, "changed"),
    e.restart && h("span", { class: "badge" }, "applies after a restart"),
    e.confirm && h("span", { class: "badge warn" }, "asks to confirm"),
    e.advanced && h("span", { class: "badge" }, "advanced"),
    !e.changed ? null : h("span", {}, "default: ", h("code", {}, e.type === "secret" ? "none" : Array.isArray(e.default) ? (e.default.join(", ") || "empty") : (String(e.default) === "" ? "empty" : String(e.default)))));
  return h("div", { class: "row" },
    h("div", { class: "text" }, h("label", { class: "label", for: "c_" + e.key.replace(/\./g, "_") }, labelOf(e)), h("div", { class: "help" }, e.help), meta),
    h("div", { class: "ctl" }, control(e), e.changed && e.type !== "secret" && h("button", { class: "btn small", onclick: () => reset(e), title: "Back to the default" }, "Reset")));
}

function pointerPicker(e) {
  const names = ["crystal", "paper", "jelly", "ice", "metal", "orbit"];
  const cell = (name, glyph, text) => h("button", { class: "pick", "aria-pressed": String(e.value === name), title: text || name, onclick: () => e.value !== name && apply([e], [name]) },
    glyph ? h("span", { class: "glyph", "aria-hidden": "true" }, glyph) : h("img", { src: "cursor/" + name + ".png", alt: "" }), h("span", {}, name));
  return h("div", { class: "picker", role: "group", "aria-label": "Pointer style" },
    cell("random", "?", "A different one each session"), cell("classic", "➤", "The plain arrow"), names.map((n) => cell(n)));
}

/* ---------- decision model ---------- */
function decisionCard() {
  const D = S.decision; const st = h("div", { class: "msg", role: "status" });
  const say = (t, ok) => { st.textContent = t; st.className = "msg " + (ok === undefined ? "" : ok ? "ok" : "bad"); };
  const base = { jev: "https://api.typesafe.ai", openai: "https://api.openai.com/v1" };
  const models = { jev: "jev-latest", openai: "e.g. gpt-4.1-nano, llama-3.1-8b-instant" };
  const radios = ["jev", "openai"].map((v) => h("input", { type: "radio", name: "provider", value: v, checked: D.provider === v }));
  const kind = (v, title, text, r) => h("label", { class: "kind" }, r, h("div", {}, h("b", {}, title), h("span", {}, text)));
  const url = h("input", { type: "url", id: "d_url", value: D.base_url, autocomplete: "off", spellcheck: false });
  const model = h("input", { type: "text", id: "d_model", value: D.model, autocomplete: "off", spellcheck: false });
  const key = h("input", { type: "password", id: "d_key", autocomplete: "off", spellcheck: false });
  const keyHint = h("div", { class: "hint" }), baseHint = h("div", { class: "hint" });
  const prov = () => (radios.find((r) => r.checked) || {}).value || "";
  const refresh = () => { const p = prov() || "jev"; url.placeholder = base[p]; model.placeholder = models[p]; baseHint.textContent = "Leave empty for " + base[p] + "."; };
  keyHint.textContent = D.key_hint ? "Saved: " + D.key_hint + ". Leave empty to keep it." : D.key_env ? "Read from the environment variable " + D.key_env + "." : "Not needed for a server on this computer.";
  for (const r of radios) r.onchange = () => { url.value = ""; model.value = ""; refresh(); };
  refresh();
  const form = () => ({ provider: prov(), base_url: url.value, model: model.value, api_key: key.value });
  const buttons = [];
  const busy = (on) => buttons.forEach((b) => { b.disabled = on; });
  const run = (fn) => async () => { busy(true); try { await fn(); } catch (err) { say("The server didn't answer: " + err, false); } busy(false); };
  buttons.push(
    h("button", { class: "btn filled", onclick: run(async () => {
      if (!prov()) return say("Choose a kind of model first.", false);
      say("Saving…"); const r = await post("save", form());
      if (r.ok) { key.value = ""; if (r.key_hint) keyHint.textContent = "Saved: " + r.key_hint + ". Leave empty to keep it."; D.provider = prov(); }
      say(r.ok ? r.message : r.error, r.ok);
    }) }, "Save"),
    h("button", { class: "btn", onclick: run(async () => {
      if (!prov()) return say("Choose a kind of model first.", false);
      say("Asking the model…"); const r = await post("test", form()); say(r.ok ? r.message : r.error, r.ok);
    }) }, "Test"),
    h("button", { class: "btn danger", onclick: run(async () => {
      if (!confirm("Remove the decision model and its key?")) return;
      const r = await post("remove");
      if (r.ok) { radios.forEach((x) => { x.checked = false; }); url.value = model.value = key.value = ""; keyHint.textContent = ""; refresh(); }
      say(r.ok ? r.message : r.error, r.ok);
    }) }, "Remove"));
  return h("div", { class: "card pad" },
    h("h3", {}, "Model and API key"),
    h("p", { class: "help" }, "A fast model the agent asks yes/no, choice and score questions about what is on screen, so it reads less and decides sooner. Your key is saved on this computer and never goes through the chat."),
    h("div", { class: "kinds" },
      kind("jev", "Jev (TypeSafe System One)", "Made for decisions: answers in well under a second, with probabilities. Also any server that speaks the same API.", radios[0]),
      kind("openai", "OpenAI-compatible chat model", "OpenAI, Groq, Cerebras, OpenRouter, Ollama, LM Studio… A small, fast model works best.", radios[1])),
    h("div", { class: "field" }, h("label", { for: "d_url" }, "Address (base URL)"), url, baseHint),
    h("div", { class: "field" }, h("label", { for: "d_model" }, "Model"), model),
    h("div", { class: "field" }, h("label", { for: "d_key" }, "API key"), key, keyHint),
    h("div", { class: "actions" }, buttons), st);
}

/* ---------- render ---------- */
function visible(e) {
  if (e.type === "custom") return false;
  if (view.changedOnly && !e.changed) return false;
  if (!view.advanced && e.advanced && !e.changed && !view.query) return false;
  if (view.query) {
    const q = view.query.toLowerCase();
    return (e.key + " " + labelOf(e) + " " + e.help + " " + e.group).toLowerCase().includes(q);
  }
  return e.group === current;
}

function renderNav() {
  const nav = $("nav"); nav.textContent = "";
  for (const g of S.groups) {
    const n = S.entries.filter((e) => e.group === g && e.type !== "custom").length;
    const ch = S.entries.filter((e) => e.group === g && e.changed).length;
    nav.append(h("button", { "aria-current": String(!view.query && g === current), onclick: () => { view.query = ""; $("q").value = ""; go(g); } },
      h("span", {}, g), h("span", { class: "count" }, ch ? ch + " changed" : String(n))));
  }
}

function render() {
  if (!S) return;
  renderNav();
  const main = $("main"); main.textContent = "";
  const rows = S.entries.filter(visible);
  main.append(h("h2", {}, view.query ? "Search results" : current),
    h("p", { class: "lead" }, view.query ? rows.length + " setting" + (rows.length === 1 ? "" : "s") + " match “" + view.query + "”." : S.blurbs[current] || ""),
    h("div", { class: "tools" },
      h("button", { class: "chip", "aria-pressed": String(view.changedOnly), onclick: () => { view.changedOnly = !view.changedOnly; render(); } }, "Changed from default"),
      h("button", { class: "chip", "aria-pressed": String(view.advanced), onclick: () => { view.advanced = !view.advanced; render(); } }, "Show advanced")));
  if (!view.query && current === "Decision model") main.append(decisionCard());
  if (!view.query && current === "Pointer") {
    const e = S.entries.find((x) => x.key === "overlay.cursor_style");
    main.append(h("div", { class: "card" }, h("h3", {}, "Pointer style"), pointerPicker(e)));
  }
  if (!view.query && current === "Several agents") { /* the chat switch is the hub.chat setting below */ }
  const list = rows.filter((e) => view.query || e.key !== "overlay.cursor_style" || current !== "Pointer");
  if (list.length) {
    const card = h("div", { class: "card" });
    let last = null;
    for (const e of list) {
      if (view.query && e.group !== last) { card.append(h("h3", {}, e.group)); last = e.group; }
      card.append(row(e));
    }
    main.append(card);
  } else if (view.query || view.changedOnly) main.append(h("div", { class: "empty" }, view.query ? "Nothing matches." : "Nothing in this group differs from its default."));
  main.append(h("footer", { class: "where" }, S.path ? "Settings file: " + S.path : "This server keeps its settings in memory, so nothing can be saved here."));
}

function go(g) { current = g; history.replaceState(null, "", "#" + slug(g)); render(); window.scrollTo(0, 0); }

async function load() {
  S = await post("state");
  if (!S.ok) { $("main").textContent = S.error || "Couldn't read the settings."; return; }
  $("ver").textContent = "v" + S.version;
  document.documentElement.dataset.accent = S.accent; theme(S.theme);
  const want = S.groups.find((g) => slug(g) === location.hash.slice(1)) || S.groups[0];
  current = want; render();
}

$("q").addEventListener("input", (ev) => { view.query = ev.target.value.trim(); render(); });
for (const b of document.querySelectorAll("#themes button")) b.onclick = async () => {
  theme(b.dataset.t); const e = S && S.entries.find((x) => x.key === "panel.theme");
  if (e) { const r = await post("set", { confirmed: false, changes: [{ key: "panel.theme", value: b.dataset.t }] }); if (r.ok) { e.value = b.dataset.t; e.changed = b.dataset.t !== e.default; render(); } else snack(r.error, true); }
};
$("done").onclick = async () => { try { await post("close"); } catch (e) {} document.body.textContent = "You can close this tab."; window.close(); };
window.addEventListener("hashchange", () => { if (!S) return; const g = S.groups.find((x) => slug(x) === location.hash.slice(1)); if (g && g !== current) { current = g; render(); } });
theme(document.documentElement.dataset.theme);
load().catch((err) => { $("main").textContent = "The server didn't answer: " + err; });
</script>
</body>
</html>
