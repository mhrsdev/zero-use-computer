# computer-use settings (github.com/mhrsdev/zero-use-computer)
#
# Every option is listed here with its default value. Edit any of them; a
# running server picks up changes automatically (hot_reload). You can also
# change settings from the command line:
#
#   computer-use-mcp config set screenshot.attach always
#   computer-use-mcp config add tools.disabled drag
#   computer-use-mcp config show          # effective settings
#   computer-use-mcp config check         # validate + report unknown keys
#
# The agent itself has no tool to change these settings, except the decision
# model's ([decision]), which you can ask it to set up for you.
#
# There is no access control in these settings: which apps and actions the
# agent may use is decided by its security skill
# (skills/computer-use-security/SKILL.md), not by this server.

# Expose the clipboard tools (get_clipboard / set_clipboard).
clipboard = true
# Never attach screenshots anywhere (tree-only; lowest token use).
text_only = false
# When an action opens a new window (a dialog, a menu), switch to it for the
# change report and for get_app_state calls that don't name a window.
follow_new_windows = true
# Put the real mouse pointer back after a synthesized click/scroll/drag, so the
# agent never takes the user's mouse away (Linux, Windows).
restore_pointer = true
# Re-read this file when it changes, without restarting the server.
hot_reload = true
# Seconds launch_app waits for the new app's window.
launch_timeout_secs = 15.0

# Which tools the model sees. The tool list is sent with every model request,
# so fewer tools and compact descriptions save tokens on every turn.
[tools]
disabled = []               # e.g. ["drag", "batch"]
enabled = []                # if non-empty, ONLY these tools are exposed
descriptions = "compact"    # "compact" (fewer tokens), "lean" (fewer still) or "full"
# "lean" also lists the keys of nested objects (a design's layers, a
# drawing's strokes) by name instead of typing each, leaves `window` (still
# accepted) and defaults out of the schemas, and shows `decide` only once a
# decision model is set up.
# Which tools the model sees at first:
#   "off"          = every tool, always (default)
#   "dispatch"     = the base tools and find_tools; the others are found by
#                    name or category and run through use_tool. The list
#                    never changes: any client, prompt cache intact.
#   "list_changed" = the base tools and find_tools; a category it finds is
#                    added to the list (clients that support it are told)
manager = "off"
# "full" = every tool the other settings allow; "small" = a fixed small
# set for smaller models (look, find, wait, click, set, type, keys, scroll,
# list and launch apps). A non-empty `enabled` wins.
preset = "full"
# A call without `app` acts on the app of the last call that named one, and
# the schemas don't require `app` (fewer tokens for the model to write).
default_app = false
# launch_app answers with the app's first state, as get_app_state would.
launch_look = true

[screenshot]
enabled = true
# When get_app_state includes an image:
#   auto   = first view of a window, a large change, or a sparse tree (default)
#   always = every call (Codex behaviour; most tokens)
#   never  = never (the model can still call the screenshot tool)
attach = "auto"
# In auto mode, attach when the tree has fewer interactive elements than this.
auto_sparse_threshold = 2
# Longest image edge in pixels. Image tokens grow with width x height, so this
# is the main image-token knob (1024 ≈ 35% fewer tokens than 1280).
max_dimension = 1280
# Opt-in: send screenshots attached on their own to a window whose tree
# already says what is there as a smaller overview of this size (e.g. 768 ≈
# 60% fewer image tokens than 1280). It trades detail for tokens, so it is
# off: 0 = always max_dimension. screenshot=true always gets max_dimension.
overview_max_dimension = 0
format = "png"              # "png" or "jpeg"
jpeg_quality = 85
png_compression = "fast"    # "fast", "default" or "best" (file size only)
resize_filter = "fast"      # "fast", "smooth" or "sharp"
# Follow-up screenshots of a screen the model has already seen: "auto" sends
# only the part that changed (with its position in the earlier image), when
# it is a small part of the window; "full" always sends the whole window.
scope = "auto"
region_max_ratio = 0.5      # a bigger change than this share of the window: whole window
region_padding = 24         # margin around the changed part (pixels)
region_min_size = 200       # the part is at least this big on each side, for context
# Attach automatic screenshots by how the model works in an app: once it
# has looked a few times without ever using pixels there (no x/y, no
# screenshot asked for), well-described windows come without one.
adaptive = false
locate_picture = true       # locate sends the window with the places found numbered
# Experimental: when no screenshot is attached, a small strip of the
# buttons without a name, each numbered with its element_index.
icon_sprite = false

[tree]
max_nodes = 1200            # elements shown per get_app_state
max_walk = 6000             # elements read from the app before pruning
max_depth = 64
max_text_len = 160          # characters of text/value shown per element
indent = 1                  # spaces per tree level
show_actions = true         # actions=[...] on elements
show_states = true          # (focused, disabled, checked, ...)
diff = true                 # later get_app_state calls return a diff
diff_full_ratio = 0.33      # show the full tree when more than this changed
report_changes = true       # append "state after the action" to action results
report_changes_max_lines = 25
# Token budget of one tree or diff (estimated). Only bigger trees are
# shortened; folded and cut elements stay findable with find_element, and
# the focused or selected element is never folded away. 0 = no limit.
max_tokens = 10000
# How a tree over the budget is shortened:
#   "normal" = fold long lists, then other long runs, then cut what's left
#   "light"  = only fold long lists (rows, list items…); never cut
#   "off"    = never shorten: every tree is sent whole
# The model can also ask for one whole tree with get_app_state(max_tokens=0).
summarize = "normal"
fold_keep = 5               # items kept at the start of a folded list (+2 at its end)
brief_repeats = true        # explain notes in full once, then briefly (false = always in full)
# Say each thing once, losing nothing: look-alike siblings as records (the
# roles once, one line a record), a table's cells a row a line, flags and
# actions the role implies left out (text fields are editable unless marked
# read-only), many removed elements as ranges of indices, added ones under
# their parent, a short header when the window is as before, no echo of a
# value just set.
compact = true
# What an action's result says of what changed:
#   "full"     = every change, up to report_changes_max_lines (default)
#   "relevant" = changes in and around what the action acted on, new windows
#                and added elements, and how many others there are
#   "brief"    = how many changes, and a new screen or window
report = "full"
# Elements that change on their own (clocks, progress, spinners): after a
# few reports in a row, summed up in one line instead of listed each time.
quiet_volatile = false

[timing]
settle_ms = 40              # pause after each action before looking again
# "adaptive": then wait until the UI stops changing (two reads in a row
# agree), at most settle_max_ms. "fixed": only the settle_ms pause.
settle = "adaptive"
settle_max_ms = 2000
settle_poll_ms = 50         # interval between checks while waiting
key_delay_ms = 10           # pause between keys in a press_key sequence
app_cache_ms = 1500         # reuse the running-app list for this long
wait_timeout_ms = 10000     # wait_for default timeout
wait_poll_ms = 400          # wait_for default poll interval
expect_wait_ms = 2000       # how long an action with `expect` waits for it to show

[cache]
# Screen memory: when the app shows a screen the model has already seen (it
# went back a page, closed a dialog, reopened a panel), restore that screen's
# element indices and send only what differs — no new tree, no new screenshot.
enabled = true
max_screens = 32            # screens remembered, all apps together (LRU)
max_memory_kb = 8192        # memory budget for remembered screens
match_threshold = 0.8       # share of common elements to count as the same screen
dedupe_screenshots = true   # don't re-send an unchanged screenshot of a screen
pixel_grid = 64             # fingerprint cells across the longer side
pixel_tolerance = 2         # per-cell brightness drift still "unchanged"
snapshot_ttl_ms = 200       # reuse a tree/window read this recent if nothing ran since (0 = off)
# After this many (estimated) tokens of results since an app's tree was last
# sent whole, the next get_app_state sends it whole again, with a picture: in
# a long conversation the model, or a host that trims old results, may have
# lost what diffs refer to. 0 = never.
rebase_after_tokens = 0

[overlay]
# While the agent works: its own cursor (the real mouse is never moved or
# changed), a border around the window it works on, and a status label. It
# runs in a separate helper process, is click-through, is left out of the
# agent's screenshots, and vanishes when the work ends or the server stops.
enabled = true
show_border = true
show_cursor = true
show_label = true
click_effect = true          # a ripple where the agent clicks
border_target = "screen"     # glow around the whole "screen" or the "window" worked on
border_width = 3             # bright core line
glow_size = 36               # how far the glow fades out (0 = a plain line)
scale = 0.0                  # size multiplier; 0 = follow display scaling
# Label per state.
label_working = "Zero is using the computer"
label_thinking = "Zero is thinking…"
label_error = "Zero hit an error"
label_done = "Zero is done"
label_paused = "Paused while you use the computer"
label_stopped = "Zero stopped. Press {hotkey} to let it continue"
# Colours per state (#RRGGBB or #RRGGBBAA).
color_thinking = "#D4A017"   # gold: the model is thinking
color_working = "#1E88E5"    # blue: acting on the computer
color_error = "#E53935"      # red: something failed
color_done = "#2E7D32"       # green: finished, then everything disappears
color_paused = "#78909C"     # grey: waiting while you use the mouse/keyboard
color_stopped = "#FF6D00"    # orange: stopped with the emergency stop key
cursor_color = "#9C27B0"     # the agent cursor itself; its ring follows the state
cursor_tag = "Zero"          # name tag beside the agent cursor ("" = none)
done_after_ms = 20000        # no new action for this long: done, then hidden
done_linger_ms = 1500
error_hold_ms = 2500
move_ms = 220                # cursor glide time
fade_in_ms = 250             # appear gradually
fade_out_ms = 1200           # disappear gradually, never abruptly
transition_ms = 300          # blend from one state colour to the next
capture_hide_ms = 40         # X11 only: pause after hiding before a screenshot
font = ""                    # label font file ("" = a system font)
command = ""                 # helper program for library embedders

# Reading text off the screen, for apps whose accessibility tree has almost
# nothing in it (games, canvases, remote desktops). Recognised lines become
# numbered "ocr text" elements the agent can click.
[ocr]
mode = "auto"               # "auto" (sparse trees only), "always" or "off"
engine = "auto"             # "auto" (the OS's own, else Tesseract), "native", "tesseract"
sparse_threshold = 3        # auto: fewer interactive elements than this
languages = []              # e.g. ["en", "de"]; [] = your languages (Tesseract: English)
min_confidence = 0.4        # leave out lines recognised with less confidence (0–1)
max_lines = 150
tesseract_path = "tesseract"
# Areas of a window the tree says nothing about (a canvas next to a full
# toolbar, a picture, a custom-drawn panel), however many elements the rest
# of the window has: read their text off the screen and check their pixels
# on every look (an unchanged picture still isn't sent again). Off until
# measured: bench/README.md.
blind_regions = false

# Reading desktop notifications (the get_notifications tool). Off by
# default: notifications carry other apps' messages and codes.
[notifications]
enabled = false
apps = []                   # only these apps ([] = any app)
mask_codes = true           # mask one-time / verification codes
keep = 50                   # how many are kept (Linux)

# Scripts (the script tool): small programs the agent writes and the server
# runs, for what the other tools can't do in one call — loops over tool
# calls, maths, data from files or the web, pictures built on the graph-paper
# page. Every tool call a script makes is an ordinary tool call: the stop
# key, the pause while you work and the masking all apply. Saved scripts are
# kept in `dir` (default ~/.computer-use/scripts) and can be edited by hand.
[script]
saved_as_tools = true       # each saved script is also a tool of its own
# Files scripts may use: "none", "workspace" (only <dir>/files), "read"
# (read any file, write only in <dir>/files) or "all" (read and write any).
files = "read"
web = true                  # fetch() and download() over http(s), with curl
max_seconds = 300           # longest run of one script, tool calls included
# dir = "/path/to/scripts"

# Checking that actions worked.
[verify]
enabled = true              # check each action's result; tell the agent when it didn't work
retry = true                # an action that clearly failed is tried once more another way
# Also retry presses after which nothing visible changed. Off: some actions
# (pay, send…) show their effect late and must not be repeated.
retry_on_no_change = false

# Your controls over a running agent.
[control]
# Emergency stop: this key combination stops the agent at once, from any app
# (every tool call is refused until you press it again). "" = no stop key.
stop_hotkey = "ctrl+alt+escape"
# Before each action, wait while you are using the mouse or keyboard and
# continue once you stop. Only the system idle time is read — never what you
# type or where you click.
pause_on_user_input = true
resume_after_idle_ms = 1500  # how long you must be idle before it continues
max_pause_secs = 120         # then the action fails and the agent is told why
# Opens the decision model's settings page in your browser, from any app
# ("" = none; `computer-use-mcp settings` opens it too).
settings_hotkey = "ctrl+alt+j"

# A decision model: a fast model that answers typed questions about what is
# on screen (yes/no, one of some options, a score), so the agent doesn't
# have to read and judge everything itself — the `decide` tool, wait_for's
# `until` and scripts' decide(). Easiest set up on the page Ctrl+Alt+J
# opens: the key never goes through the chat. What it judges (text you or
# the agent pass, or an app's window as text) is sent to this API.
[decision]
provider = ""               # "jev" (TypeSafe's System One API, or a compatible server),
                            # "openai" (any OpenAI-compatible chat API), "" = none
base_url = ""               # "" = https://api.typesafe.ai or https://api.openai.com/v1
model = ""                  # "" = jev-latest (jev); needed for openai
api_key = ""                # kept here; this file is then readable by you only
api_key_env = ""            # or the name of an environment variable holding the key
timeout_ms = 15000          # longest wait for one answer
max_state_chars = 20000     # a longer state keeps its start and end
parallel = 8                # requests at once when judging several items

# Private data is masked in element text and blacked out of screenshots
# before anything is sent to the model.
[privacy]
redact_passwords = true      # password fields
redact_card_numbers = true   # card numbers (only the last 4 digits stay in text)
# Fields whose label contains one of these have their contents masked too.
redact_labels = [
    "cvv",
    "cvc",
    "security code",
    "card number",
    "one-time code",
    "verification code",
]
style = "fill"               # "fill" (solid box) or "pixelate"

[audit]
enabled = false             # append a JSONL line (metadata only) per call
# path = "/path/to/audit.log"   # default: <COMPUTER_USE_HOME>/audit.log

[server]
log = "warn"                # error, warn, info, debug, trace
http_addr = ""              # e.g. "127.0.0.1:8787" to serve over HTTP
http_token = ""             # bearer token, required when http_addr is set
# The MCP instructions sent at connection: "full", "short" (the loop and
# the safety rules in a few lines, for clients that load the skills) or "off".
instructions = "full"

[linux]
batch_size = 48             # elements whose AT-SPI queries run concurrently
text_max_chars = 2000       # longest text read from a text element

[macos]
batch_attributes = true     # read all of an element's attributes in one call
messaging_timeout_secs = 2.0

[windows]
use_cache_request = true    # fetch a whole window's tree in one UIA call
