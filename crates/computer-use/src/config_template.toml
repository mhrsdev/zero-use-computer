# computer-use settings
#
# Every option is listed here with its default value. Edit any of them; a
# running server picks up changes automatically (hot_reload). You can also
# change settings from the command line:
#
#   computer-use-mcp config set screenshot.attach always
#   computer-use-mcp config add approvals.always_allow com.apple.TextEdit
#   computer-use-mcp config show          # effective settings
#   computer-use-mcp config check         # validate + report unknown keys
#
# The agent itself has no tool to change these settings.

# Expose the clipboard tools (get_clipboard / set_clipboard).
clipboard = true
# Never attach screenshots anywhere (tree-only; lowest token use).
text_only = false
# When an action opens a new window (a dialog, a menu), switch to it for the
# change report and for get_app_state calls that don't name a window.
follow_new_windows = true
# Put the real mouse pointer back after a synthesized click/scroll/drag, so the
# agent never takes the user's mouse away (Linux, Windows).
restore_pointer = true
# Re-read this file when it changes, without restarting the server.
hot_reload = true
# Seconds launch_app waits for the new app's window.
launch_timeout_secs = 15.0

[approvals]
# prompt    = ask the first time each app is used (default)
# allowlist = only apps in always_allow; never ask
# allow_all = every app not blocked below
mode = "prompt"
# Apps allowed without asking (name, bundle id, exe name; "*" suffix = prefix).
# A specific app listed here is allowed even if its [sensitive] category is
# blocked — this is how you grant sensitive apps one at a time.
always_allow = []
# Apps that are never controlled.
always_deny = []
# Apps that host agents (treated as the "agent_apps" sensitive category).
agent_apps = [
    "com.openai.chat",
    "com.openai.codex",
    "ChatGPT",
    "Codex",
    "com.anthropic.claudefordesktop",
    "Claude",
]

# Sensitive app categories: "block" (default), "ask" (confirm each time), or
# "allow" (treated like any other app).
[sensitive]
terminals = "block"         # terminal emulators and shells
credentials = "block"       # password managers, keychains
security_prompts = "block"  # OS authentication / consent / login prompts
agent_apps = "block"        # apps listed in approvals.agent_apps
own_process = "block"       # this server and the agent that launched it
# Your own patterns to add to a category.
extra_terminals = []
extra_credentials = []
extra_security_prompts = []

# Confirmation for consequential presses (a control whose label contains one
# of the keywords). "ask" (default), "allow" (never confirm) or "block".
[guard]
mode = "ask"
keywords = [
    "send",
    "delete",
    "remove",
    "discard",
    "pay",
    "buy",
    "purchase",
    "checkout",
    "order",
    "transfer",
    "confirm",
    "publish",
    "post",
    "submit",
    "trash",
    "erase",
    "wipe",
    "shut down",
    "restart",
    "log out",
    "sign out",
    "uninstall",
    "format",
]

# Which tools the model sees. The tool list is sent with every model request,
# so fewer tools and compact descriptions save tokens on every turn.
[tools]
disabled = []               # e.g. ["drag", "batch"]
enabled = []                # if non-empty, ONLY these tools are exposed
descriptions = "compact"    # "compact" (fewer tokens) or "full"

[screenshot]
enabled = true
# When get_app_state includes an image:
#   auto   = first view of a window, a large change, or a sparse tree (default)
#   always = every call (Codex behaviour; most tokens)
#   never  = never (the model can still call the screenshot tool)
attach = "auto"
# In auto mode, attach when the tree has fewer interactive elements than this.
auto_sparse_threshold = 2
# Longest image edge in pixels. Image tokens grow with width x height, so this
# is the main image-token knob (1024 ≈ 35% fewer tokens than 1280).
max_dimension = 1280
format = "png"              # "png" or "jpeg"
jpeg_quality = 85
png_compression = "fast"    # "fast", "default" or "best" (file size only)
resize_filter = "fast"      # "fast", "smooth" or "sharp"

[tree]
max_nodes = 1200            # elements shown per get_app_state
max_walk = 6000             # elements read from the app before pruning
max_depth = 64
max_text_len = 160          # characters of text/value shown per element
indent = 1                  # spaces per tree level
show_actions = true         # actions=[...] on elements
show_states = true          # (focused, disabled, checked, ...)
diff = true                 # later get_app_state calls return a diff
diff_full_ratio = 0.33      # show the full tree when more than this changed
report_changes = true       # append "state after the action" to action results
report_changes_max_lines = 25

[timing]
settle_ms = 40              # pause after each action for the UI to update
key_delay_ms = 10           # pause between keys in a press_key sequence
app_cache_ms = 1500         # reuse the running-app list for this long
wait_timeout_ms = 10000     # wait_for default timeout
wait_poll_ms = 400          # wait_for default poll interval

[cache]
# Screen memory: when the app shows a screen the model has already seen (it
# went back a page, closed a dialog, reopened a panel), restore that screen's
# element indices and send only what differs — no new tree, no new screenshot.
enabled = true
max_screens = 32            # screens remembered, all apps together (LRU)
max_memory_kb = 8192        # memory budget for remembered screens
match_threshold = 0.8       # share of common elements to count as the same screen
dedupe_screenshots = true   # don't re-send an unchanged screenshot of a screen
pixel_grid = 64             # fingerprint cells across the longer side
pixel_tolerance = 2         # per-cell brightness drift still "unchanged"
snapshot_ttl_ms = 200       # reuse a tree/window read this recent if nothing ran since (0 = off)

[overlay]
# While the agent works: its own cursor (the real mouse is never moved or
# changed), a border around the window it works on, and a status label. It
# runs in a separate helper process, is click-through, is left out of the
# agent's screenshots, and vanishes when the work ends or the server stops.
enabled = true
show_border = true
show_cursor = true
show_label = true
click_effect = true          # a ripple where the agent clicks
border_target = "screen"     # glow around the whole "screen" or the "window" worked on
border_width = 3             # bright core line
glow_size = 36               # how far the glow fades out (0 = a plain line)
scale = 0.0                  # size multiplier; 0 = follow display scaling
# Label per state; {action} is what is pending.
label_working = "Zero is using the computer"
label_thinking = "Zero is thinking…"
label_approval = "Waiting for your approval: {action}"
label_danger = "Sensitive action: {action}"
label_error = "Zero hit an error"
label_done = "Zero is done"
label_paused = "Paused while you use the computer"
label_stopped = "Zero stopped. Press {hotkey} to let it continue"
label_allow = "Allow"        # buttons of the on-screen confirmation
label_deny = "Deny"
# Colours per state (#RRGGBB or #RRGGBBAA).
color_thinking = "#D4A017"   # gold: the model is thinking
color_working = "#1E88E5"    # blue: acting on the computer
color_approval = "#FFE600"   # yellow: waiting for your approval
color_danger = "#000000"     # black: a sensitive action (send, delete, pay…)
color_error = "#E53935"      # red: something failed
color_done = "#2E7D32"       # green: finished, then everything disappears
color_paused = "#78909C"     # grey: waiting while you use the mouse/keyboard
color_stopped = "#FF6D00"    # orange: stopped with the emergency stop key
cursor_color = "#9C27B0"     # the agent cursor itself; its ring follows the state
cursor_tag = "Zero"          # name tag beside the agent cursor ("" = none)
done_after_ms = 20000        # no new action for this long: done, then hidden
done_linger_ms = 1500
error_hold_ms = 2500
move_ms = 220                # cursor glide time
fade_in_ms = 250             # appear gradually
fade_out_ms = 1200           # disappear gradually, never abruptly
transition_ms = 300          # blend from one state colour to the next
confirm_on_screen = "when_no_client"   # never | when_no_client | always
confirm_timeout_secs = 120   # an unanswered on-screen confirmation is denied
capture_hide_ms = 40         # X11 only: pause after hiding before a screenshot
font = ""                    # label font file ("" = a system font)
command = ""                 # helper program for library embedders

# Your controls over a running agent.
[control]
# Emergency stop: this key combination stops the agent at once, from any app
# (every tool call is refused until you press it again). "" = no stop key.
stop_hotkey = "ctrl+alt+escape"
# Before each action, wait while you are using the mouse or keyboard and
# continue once you stop. Only the system idle time is read — never what you
# type or where you click.
pause_on_user_input = true
resume_after_idle_ms = 1500  # how long you must be idle before it continues
max_pause_secs = 120         # then the action fails and the agent is told why

# Private data is masked in element text and blacked out of screenshots
# before anything is sent to the model.
[privacy]
redact_passwords = true      # password fields
redact_card_numbers = true   # card numbers (only the last 4 digits stay in text)
# Fields whose label contains one of these have their contents masked too.
redact_labels = [
    "cvv",
    "cvc",
    "security code",
    "card number",
    "one-time code",
    "verification code",
]
style = "fill"               # "fill" (solid box) or "pixelate"

[audit]
enabled = false             # append a JSONL line (metadata only) per call
# path = "/path/to/audit.log"   # default: <COMPUTER_USE_HOME>/audit.log

[server]
headless_approve = "deny"   # when approval is needed but no one can be asked
log = "warn"                # error, warn, info, debug, trace
http_addr = ""              # e.g. "127.0.0.1:8787" to serve over HTTP
http_token = ""             # bearer token required on the HTTP endpoint

[linux]
batch_size = 48             # elements whose AT-SPI queries run concurrently
text_max_chars = 2000       # longest text read from a text element

[macos]
batch_attributes = true     # read all of an element's attributes in one call
messaging_timeout_secs = 2.0

[windows]
use_cache_request = true    # fetch a whole window's tree in one UIA call
