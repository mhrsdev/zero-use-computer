<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision model · Zero Use Computer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6676;
    --line: #d9dee6; --accent: #1e6fd9; --accent-text: #ffffff;
    --ok: #1f7a3a; --bad: #b3261e; --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #2e3542; --accent: #5aa0ff; --accent-text: #0b1220;
      --ok: #6fd18b; --bad: #ff8a80; --field: #141820;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  fieldset { border: 0; padding: 0; margin: 0 0 18px; }
  legend, label { display: block; font-weight: 600; margin-bottom: 6px; }
  .kinds { display: grid; gap: 8px; }
  .kind {
    display: flex; gap: 10px; align-items: flex-start; font-weight: 400;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    cursor: pointer;
  }
  .kind input { margin-top: 4px; }
  .kind b { display: block; }
  .kind span { color: var(--muted); font-size: 13px; }
  .field { margin-bottom: 16px; }
  input[type=text], input[type=password], input[type=url] {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text);
    font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button {
    font: inherit; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .6; cursor: default; }
  #status { min-height: 1.5em; margin-top: 14px; overflow-wrap: anywhere; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  footer { color: var(--muted); font-size: 13px; margin-top: 14px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Decision model</h1>
    <p class="lead">A fast model the agent asks yes/no, choice and score questions about what is on screen, so it reads less and decides sooner. Your key is saved on this computer and never goes through the chat.</p>

    <fieldset>
      <legend>Kind of model</legend>
      <div class="kinds">
        <label class="kind"><input type="radio" name="provider" value="jev">
          <div><b>Jev (TypeSafe System One)</b><span>Made for decisions: answers in well under a second, with probabilities. Key from your TypeSafe account. Also any server that speaks the same API (local-jev, jeff…).</span></div></label>
        <label class="kind"><input type="radio" name="provider" value="openai">
          <div><b>OpenAI-compatible chat model</b><span>OpenAI, Groq, Cerebras, OpenRouter, Ollama, LM Studio… A small, fast model works best.</span></div></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="base_url">Address (base URL)</label>
      <input id="base_url" type="url" autocomplete="off" spellcheck="false">
      <div class="hint" id="base_hint"></div>
    </div>
    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="api_key">API key</label>
      <input id="api_key" type="password" autocomplete="off" spellcheck="false">
      <div class="hint" id="key_hint"></div>
    </div>

    <div class="buttons">
      <button class="primary" id="save">Save</button>
      <button id="test">Test</button>
      <button class="danger" id="remove">Remove</button>
      <button id="close">Done</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <footer id="where"></footer>
  </div>
</main>
<script>
const S = __SETTINGS__;
const $ = (id) => document.getElementById(id);
const base = { jev: "https://api.typesafe.ai", openai: "https://api.openai.com/v1" };
const models = { jev: "jev-latest", openai: "e.g. gpt-4.1-nano, llama-3.1-8b-instant" };

function provider() {
  const c = document.querySelector('input[name=provider]:checked');
  return c ? c.value : "";
}
function refresh() {
  const p = provider() || "jev";
  $("base_url").placeholder = base[p];
  $("model").placeholder = models[p];
  $("base_hint").textContent = "Leave empty for " + base[p] + ".";
}
function status(text, ok) {
  const s = $("status");
  s.textContent = text;
  s.className = ok === undefined ? "" : ok ? "ok" : "bad";
}
function form() {
  return { provider: provider(), base_url: $("base_url").value, model: $("model").value, api_key: $("api_key").value };
}
async function post(route, body) {
  const r = await fetch(route, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return r.json();
}
function busy(on) {
  for (const b of document.querySelectorAll("button")) b.disabled = on;
}

if (S.provider) {
  const r = document.querySelector('input[name=provider][value="' + S.provider + '"]');
  if (r) r.checked = true;
}
$("base_url").value = S.base_url || "";
$("model").value = S.model || "";
$("key_hint").textContent = S.key_hint
  ? "Saved: " + S.key_hint + ". Leave empty to keep it."
  : S.key_env ? "Read from the environment variable " + S.key_env + "." : "Not needed for a server on this computer.";
$("where").textContent = S.path ? "Saved in " + S.path : "This server keeps its settings in memory.";
refresh();
for (const r of document.querySelectorAll('input[name=provider]')) r.addEventListener("change", () => {
  $("base_url").value = ""; $("model").value = ""; refresh();
});

$("test").onclick = async () => {
  if (!provider()) return status("Choose a kind of model first.", false);
  busy(true); status("Asking the model…");
  try { const r = await post("test", form()); status(r.ok ? r.message : r.error, r.ok); }
  catch (e) { status("The server didn't answer: " + e, false); }
  busy(false);
};
$("save").onclick = async () => {
  if (!provider()) return status("Choose a kind of model first.", false);
  busy(true); status("Saving…");
  try {
    const r = await post("save", form());
    if (r.ok) {
      $("api_key").value = "";
      if (r.key_hint) $("key_hint").textContent = "Saved: " + r.key_hint + ". Leave empty to keep it.";
    }
    status(r.ok ? r.message : r.error, r.ok);
  } catch (e) { status("The server didn't answer: " + e, false); }
  busy(false);
};
$("remove").onclick = async () => {
  if (!confirm("Remove the decision model and its key?")) return;
  busy(true);
  try {
    const r = await post("remove");
    if (r.ok) {
      for (const x of document.querySelectorAll('input[name=provider]')) x.checked = false;
      $("base_url").value = ""; $("model").value = ""; $("api_key").value = "";
      $("key_hint").textContent = "";
      refresh();
    }
    status(r.ok ? r.message : r.error, r.ok);
  } catch (e) { status("The server didn't answer: " + e, false); }
  busy(false);
};
$("close").onclick = async () => {
  try { await post("close"); } catch (e) {}
  status("You can close this tab.", true);
  busy(true);
  window.close();
};
</script>
</body>
</html>
