[package]
name = "computer-use-mcp"
description = "MCP stdio server and CLI exposing Codex-style computer use to any agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "computer-use-mcp"
path = "src/main.rs"

[features]
# Optional remote transport: MCP over HTTP (JSON-RPC POST).
http = ["dep:tiny_http"]
# For tests of a host only, never in a release: `--backend mock` serves an
# in-memory desktop (the engine and the MCP server are the real ones), so a
# host can be tested over stdio on a computer with no screen.
mock-backend = []

[dependencies]
computer-use.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tiny_http = { version = "0.12", optional = true }

# A host's settings over the real program's stdio, on the scripted desktop.
[[test]]
name = "host_stdio"
required-features = ["mock-backend"]
