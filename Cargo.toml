[workspace]
resolver = "3"
members = ["crates/computer-use", "crates/computer-use-mcp"]

[workspace.package]
version = "3.9.8"
edition = "2024"
license = "Apache-2.0"
authors = ["mhrsdev"]
homepage = "https://github.com/mhrsdev/zero-use-computer"
repository = "https://github.com/mhrsdev/zero-use-computer"
rust-version = "1.88"

[workspace.dependencies]
computer-use = { path = "crates/computer-use" }
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toml_edit = "0.25"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# tiny_http 0.12.0, patched: unread request bodies are drained within limits
# (the published one allocates as much as a client's `Content-Length`
# declares), header lines are capped and a request that stops arriving times
# out: see vendor/tiny_http/PATCHED.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
